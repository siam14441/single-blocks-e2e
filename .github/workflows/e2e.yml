name: E2E - Single Blocks

# Primary entry point is workflow_dispatch: a human preparing a release points
# this at the candidate build for one block. pull_request keeps the framework
# itself honest by running every configured block against the WP/PHP matrix
# below. schedule does the same nightly, so a WordPress or PHP release that
# breaks a block is caught before somebody reports it.
#
# BLOCKS: the matrix is not hand-maintained. The "list blocks" job reads
# blocks/*.config.mjs at run time (scripts/list-blocks.mjs), so adding a block
# to this repo adds it to CI with no edit to this file.
#
# WP/PHP: three combinations run by default -- WP 6.0 (this repo's floor) and
# latest, both at whatever PHP wp-env defaults to for that release, plus WP
# 6.0 paired with PHP 7.4. That's the oldest still-supported stack and the
# one most likely to break in a way "latest everything" never exercises;
# pairing 7.4 with latest WP too would just be a fourth combination nobody
# asked for. A workflow_dispatch run can pin either input to a single value,
# same as `block` above.
on:
  workflow_dispatch:
    inputs:
      block:
        description: 'Block slug to test, e.g. table-of-contents. Leave blank to test every configured block.'
        required: false
        type: string
      plugin_zip_url:
        description: 'URL of the plugin zip to test (release candidates). Takes priority over plugin_version. Only applies when "block" is set.'
        required: false
        type: string
      plugin_version:
        description: 'Published wp.org version to test, e.g. 1.5.0. Leave blank for latest. Only applies when "block" is set.'
        required: false
        type: string
      wp_version:
        description: 'WordPress version, e.g. 6.7. Leave blank to run the default matrix (6.0 and latest).'
        required: false
        type: string
      php_version:
        description: 'PHP version, e.g. 7.4. Leave blank to run the default matrix (wp-env''s default, and 7.4 at WP 6.0).'
        required: false
        type: string
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  list-blocks:
    name: List blocks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      wp_versions: ${{ steps.matrix.outputs.wp_versions }}
      php_versions: ${{ steps.matrix.outputs.php_versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine block matrix
        id: matrix
        run: |
          if [ -n "${{ inputs.block }}" ]; then
            echo "matrix=[\"${{ inputs.block }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(node scripts/list-blocks.mjs --json)" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ inputs.wp_version }}" ]; then
            echo "wp_versions=[\"${{ inputs.wp_version }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'wp_versions=["6.0","latest"]' >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ inputs.php_version }}" ]; then
            echo "php_versions=[\"${{ inputs.php_version }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'php_versions=["default","7.4"]' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E (${{ matrix.block }}, WP ${{ matrix.wp_version }}, PHP ${{ matrix.php_version }})
    needs: list-blocks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # A failure in one block's suite must not cancel the others -- they are
      # independent plugins and an unrelated regression shouldn't hide theirs.
      fail-fast: false
      matrix:
        block: ${{ fromJson(needs.list-blocks.outputs.matrix) }}
        wp_version: ${{ fromJson(needs.list-blocks.outputs.wp_versions) }}
        php_version: ${{ fromJson(needs.list-blocks.outputs.php_versions) }}
        exclude:
          # See the WP/PHP note at the top of this file -- latest WP only
          # runs at wp-env's default PHP, not also at 7.4.
          - wp_version: latest
            php_version: '7.4'

    env:
      # wp-env's fixed defaults. Not secrets -- the environment is created and
      # destroyed inside this job and is never reachable from outside it.
      WP_BASE_URL: http://localhost:8889
      WP_USERNAME: admin
      WP_PASSWORD: password
      BLOCK: ${{ matrix.block }}
      # Empty unless workflow_dispatch supplied them -- prepare-plugin.mjs
      # treats an empty value as "not set" and falls through to the next
      # resolution step. Safe to pass unconditionally.
      PLUGIN_ZIP: ${{ inputs.plugin_zip_url }}
      PLUGIN_VERSION: ${{ inputs.plugin_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --- 1. Dependencies -------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --- 2. Resolve the build under test ---------------------------------
      # Validates the archive and echoes the parsed Version header, so the log
      # always states exactly which build these results describe.
      - name: Prepare plugin under test
        run: node scripts/prepare-plugin.mjs --block=${{ matrix.block }}

      # --- 3. Boot WordPress -----------------------------------------------
      - name: Generate wp-env config
        run: node scripts/generate-wp-env.mjs --block=${{ matrix.block }} --wp-version=${{ matrix.wp_version }} --php-version=${{ matrix.php_version }}

      - name: Start wp-env
        run: npx wp-env start

      - name: Wait for WordPress to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "$WP_BASE_URL/wp-json/"; then
              echo "WordPress is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::WordPress did not respond at $WP_BASE_URL within 60s."
          exit 1

      - name: Record PHP version
        run: echo "PHP_VERSION=$(npx wp-env run tests-cli php -r 'echo PHP_VERSION;' 2>/dev/null | tail -1)" >> "$GITHUB_ENV"

      # --- 4. Preflight ----------------------------------------------------
      # The gate that matters. Fails fast and loudly if the environment cannot
      # produce a meaningful result -- see blocks/<slug>.config.mjs for what
      # this block declares as a registration conflict, and why.
      - name: Verify environment
        run: node scripts/verify-environment.mjs --block=${{ matrix.block }}

      # --- 5. Browser ------------------------------------------------------
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # --- 6. The suite ----------------------------------------------------
      # The positional filter matches the spec filename, which by convention
      # equals the block slug -- see tests/specs/<slug>.spec.ts.
      #
      # SCOPE DIFFERS BY LEG, on purpose.
      #
      # `latest` is the primary environment: it runs everything, because that
      # is the environment the deep settings and layout assertions were written
      # against and the one a regression most urgently matters on.
      #
      # Every other pinned version is a COMPATIBILITY leg, and the question it
      # answers is narrow: does the block still register, render, detect
      # headings and navigate on this WordPress/PHP floor? It runs @compat
      # only. Running the full suite there conflates "the plugin is broken on
      # WP 6.0" with "WP 6.0's own core and theme chrome behave differently
      # than the newest release" -- and the second is not the plugin's to fix.
      # That conflation produced real false failures: the 375px assertion once
      # failed on the 6.0 leg because WP's comment-form textarea renders 403px
      # wide there, with the block itself laid out correctly.
      - name: Run E2E tests
        run: npx playwright test ${{ matrix.block }} ${{ matrix.wp_version != 'latest' && '--grep @compat' || '' }}

      # --- 7. Evidence -----------------------------------------------------
      - name: Collect WordPress debug log
        if: always()
        run: npx wp-env run tests-cli cat /var/www/html/wp-content/debug.log > artifacts/wp-debug.log 2>/dev/null || echo "(no debug.log)" > artifacts/wp-debug.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Matrix jobs share one workflow run, so block/WP/PHP together keep
          # each job's artifact bundle from overwriting a sibling's.
          name: e2e-artifacts-${{ matrix.block }}-wp${{ matrix.wp_version }}-php${{ matrix.php_version }}
          path: |
            artifacts/**/*.md
            artifacts/**/*.json
            artifacts/html-report/**
            artifacts/test-results/**
            artifacts/wp-debug.log
          retention-days: 30

      - name: Summarise in job output
        if: always()
        run: cat artifacts/qa-report-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # --- 8. Teardown -----------------------------------------------------
      - name: Destroy wp-env
        if: always()
        run: npx wp-env destroy --debug <<< "y" || true
